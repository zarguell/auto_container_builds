# dev in a box — OpenHands Agent Canvas + Pi coding agent + oh-my-pi (omp) + dev tools
#
#   docker compose up --build          → Agent Canvas on http://localhost:8000
#   docker compose run --rm dev-box shell   → raw interactive dev shell (pi, omp, python, npm, bun, ...)
#
# Wire omp into Agent Canvas: Settings → Agent → ACP → Custom, command `omp --mode acp`
#
# Mounts:
#   ./projects             working code the agents can read/write
#   ./state/home           the full coder home — Agent Canvas state
#                          (.openhands), Pi (.pi), oh-my-pi (.omp), shell
#                          config, ssh keys, anything user-local
#
# Runs as non-root user `coder` (uid 1000) with passwordless sudo; set
# PUID/PGID to your host uid/gid if the mounted dirs end up root-owned
# (Linux hosts).
services:
  dev-box:
    build:
      context: ./dockerfiles/dev-box
      dockerfile: dev-box.Dockerfile
    image: dev-box:local
    ports:
      - "8000:8000"
    volumes:
      - ./projects:/projects
      - ./state/home:/home/coder
    environment:
      PORT: "8000"
      PUID: "1000"
      PGID: "1000"
    restart: unless-stopped
